<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body {% if title == 'Accueil' %}class="home-page"{% elif title == 'Vidéo' %}class="video-page"{% elif title == 'Image' %}class="image-page"{% elif title == 'Information' %}class="information-page dark-page"{% elif title == 'Contact' %}class="contact-page dark-page"{% endif %}
      data-video="{{ video|default('')|tojson|e }}"
      data-image="{{ image|default('')|tojson|e }}">

    {% include 'header.html' %}

    <main>
        {% block content %}
        {% endblock %}
    </main>
    
    {% if not hide_search %}
    <div style="padding: 10px; display: flex; justify-content: center;">
        <div class="search-bar">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input type="text" placeholder="Comment puis-je vous aider ?" id="globalSearchInput">
            <button type="button" id="sendToApiBtn" class="send-btn" style="padding: 8px 16px; font-size: 14px; display: block;">
                <span class="btn-gold-text">ENVOYER</span>
            </button>
            <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
            <svg class="sound-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
        </div>
    </div>
    <div id="apiStatusGlobal" style="text-align: center; margin-top: 10px;"></div>
    {% endif %}
    
    <script>
        // Variables globales pour le média actuel
        (function() {
            const body = document.body;
            const videoData = body.getAttribute('data-video');
            const imageData = body.getAttribute('data-image');
            
            window.currentMedia = {
                video: videoData && videoData !== '""' ? JSON.parse(videoData) : null,
                image: imageData && imageData !== '""' ? JSON.parse(imageData) : null
            };
        })();
    </script>

    {% include 'footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script src="{{ url_for('static', filename='js/zoom.js') }}"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
