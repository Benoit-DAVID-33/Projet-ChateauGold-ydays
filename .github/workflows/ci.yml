name: CI

on:
  push:
    branches: [main, "refonte/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: goldfx
          POSTGRES_PASSWORD: goldfx
          POSTGRES_DB: goldfx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U goldfx" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Installer ffmpeg (tests de conversion vidéo)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Audit des dépendances Python (pip-audit)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --require-hashes --disable-pip -r "$RUNNER_TEMP/requirements.txt"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Tests (SQLite) + couverture
        run: uv run pytest --cov --cov-report=xml
      # Sur la base encore vide : les tests PostgreSQL y laissent ensuite leurs tables.
      - name: Migrations à jour avec le modèle
        run: uv run alembic upgrade head && uv run alembic check
        env:
          GOLDFX_DATABASE_URL: postgresql://goldfx:goldfx@localhost:5432/goldfx_test
      - name: Tests (PostgreSQL)
        run: uv run pytest -q
        env:
          GOLDFX_TEST_DATABASE_URL: postgresql://goldfx:goldfx@localhost:5432/goldfx_test
      - name: Contrat OpenAPI à jour
        run: |
          uv run goldfx openapi openapi.json
          git diff --exit-code openapi.json

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Dépendances livrées au navigateur seulement : l'outillage de build n'est pas déployé.
      - name: Audit des dépendances (npm)
        run: npm audit --omit=dev --audit-level=high
      - name: Types API générés à jour
        run: |
          npm run gen:api
          git diff --exit-code src/shared/api/schema.d.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

  e2e:
    name: Bout en bout (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cd backend && uv sync --frozen
      - run: cd frontend && npm ci
      - name: Playwright et Chromium
        run: |
          python -m pip install -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Parcours
        run: ./e2e/run.sh e2e/out
        env:
          PYTHON: python
      - name: Captures et journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: e2e/out
          retention-days: 7

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image API
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: goldfx-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Image Web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: goldfx-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Validation de compose
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' .env
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.dev.yaml config -q
