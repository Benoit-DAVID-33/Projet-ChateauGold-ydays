[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI : File()/Form()/Depends() sont des valeurs par defaut legitimes.
extend-immutable-calls = [
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.mypy]
python_version = "3.11"
files = ["server", "main.py", "external_api.py"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pylint.main]
py-version = "3.11"
jobs = 0

[tool.pylint.basic]
# Exception justifiee : "SessionLocal" est le nom conventionnel (doc officielle
# SQLAlchemy) de la fabrique de sessions, que les membres de l'equipe attendent.
good-names = ["SessionLocal"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8

[tool.pylint."messages control"]
disable = ["too-few-public-methods"]

[tool.coverage.run]
source = ["server", "main", "external_api"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"
