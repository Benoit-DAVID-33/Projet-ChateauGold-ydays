[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldfx-backend"
version = "4.0.0"
description = "Backend FastAPI de l'application GOLD FX (gestion et edition de medias avec IA)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "granian>=2.0",
    "httpx>=0.28",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pydantic>=2.10",
    "itsdangerous>=2.2",
    "werkzeug>=3.1",
    "python-dotenv>=1.0",
    "PyJWT>=2.9",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "pylint>=3.3",
    "sphinx>=8.1",
    "sphinx-rtd-theme>=3.0",
    "snakeviz>=2.2",
]

# Le backend est un paquet reutilisable : `pip install -e .` depuis backend/.
[tool.setuptools]
packages = ["server", "server.db", "server.llm", "server.routers"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "docs/_build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI : File()/Form()/Depends() sont des valeurs par defaut legitimes.
extend-immutable-calls = [
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# Les scripts ajoutent backend/ au sys.path avant d'importer : E402 est attendu.
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["server", "main.py", "external_api.py"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pylint.main]
py-version = "3.11"
jobs = 0

[tool.pylint.basic]
# Exceptions justifiees : "SessionLocal" est le nom conventionnel SQLAlchemy ;
# "_store" et "_initialized" sont des etats mutables de module (singletons
# paresseux), pas des constantes, donc volontairement en minuscules.
good-names = ["SessionLocal", "_store", "_initialized"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8

[tool.pylint."messages control"]
# too-few-public-methods : inutile pour des classes de donnees / conteneurs.
# import-outside-toplevel : choix architectural assume - les bibliotheques
#   lourdes (SQLAlchemy, httpx, werkzeug, PyJWT) sont importees a la demande
#   pour ne pas penaliser le demarrage a froid (gain mesure ~540 ms).
disable = ["too-few-public-methods", "import-outside-toplevel"]

[tool.coverage.run]
source = ["server", "main", "external_api"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
markers = [
    "unit: tests unitaires (une fonctionnalite isolee, dependances mockees)",
    "integration: tests d'integration (plusieurs composants ensemble)",
    "functional: tests fonctionnels (parcours utilisateur complet)",
    "regression: tests de non-regression (comportement fige a preserver)",
    "performance: tests de performance / charge (exclus par defaut)",
]
addopts = "--cov --cov-report=term-missing -m 'not performance'"
